[main]
font=Pragmasevka Nerd Font:size=8
dpi-aware=yes
prompt=❯ 
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic,comment,categories,keywords
fuzzy=yes
show-actions=yes
terminal=kitty -e

lines=10
width=35
horizontal-pad=10
vertical-pad=10
inner-pad=10

image-size-ratio=0.5
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=000000f2
text=f1f1f1ff
prompt=a8a1deff
input=f1f1f1ff
match=a8a1deff
selection=222222ff
selection-text=ffffffff
selection-match=a8a1deff
counter=888888ff
border=a8a1deff

[border]
width=1
radius=0

[dmenu]
mode=text
exit-immediately-if-empty=no

