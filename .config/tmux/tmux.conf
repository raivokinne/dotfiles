set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -s escape-time 0
set -g history-limit 50000
set -g focus-events on
set -s set-clipboard on
set -g display-time 1500
set -g display-panes-time 2000

set -g set-titles on
set -g set-titles-string "#S:#I:#W"
set -g detach-on-destroy off
set -g allow-passthrough on

set -s extended-keys on
set -as terminal-features ',*:extkeys'

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

bind -r '{' swap-pane -U
bind -r '}' swap-pane -D

bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

bind -r S setw synchronize-panes \; display-message "sync #{?synchronize-panes,on,off}"

bind H split-window -h -c "#{pane_current_path}"
bind V split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r ^ last-window

bind C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80

set -g status-style "bg=#1c1c24,fg=#cdcdcd"
set -g status-left "#[bg=#b4d4cf,fg=#000000,bold] #S #[default] "
set -g status-right "#{?client_prefix,#[bg=#d8647e,fg=#000000,bold] PREFIX #[default],}#[fg=#606079]%H:%M #[default]"

set -g display-panes-colour "#606079"
set -g display-panes-active-colour "#b4d4cf"

setw -g monitor-activity on
set -g visual-activity on

setw -g window-status-style "fg=#606079"
setw -g window-status-current-style "fg=#cdcdcd,bg=#000000,bold"
setw -g window-status-activity-style "fg=#d8647e,bold"
setw -g window-status-bell-style "fg=#f3be7c,bold"

setw -g mode-style "fg=#cdcdcd,bg=#333738"
setw -g clock-mode-colour "#b4d4cf"
setw -g pane-border-style "fg=#252530"
setw -g pane-active-border-style "fg=#b4d4cf"
set -g message-style "fg=#cdcdcd,bg=#1c1c24"
set -g message-command-style "fg=#cdcdcd,bg=#1c1c24"
